name: CI

on:
  push:
    branches: [master, main]
    paths:
      - 'lumina/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'lumina/**'
      - '.github/workflows/ci.yml'

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: lumina/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: lumina
        run: pnpm install --frozen-lockfile

      - name: Run type checking
        working-directory: lumina
        run: pnpm typecheck

      - name: Run linting
        working-directory: lumina
        run: pnpm lint

      - name: Run tests
        working-directory: lumina
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: lumina/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: lumina
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        working-directory: lumina
        run: pnpm build
