name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

permissions:
  contents: read

jobs:
  # Determine version once, share across jobs
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Get Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CLEAN_VERSION=$(echo "${{ inputs.version }}" | sed 's/^v//')
          else
            CLEAN_VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $CLEAN_VERSION"

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: lumina/pnpm-lock.yaml

      - name: Set Version in package.json
        working-directory: lumina/apps/desktop
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $pkg = Get-Content package.json | ConvertFrom-Json
          $pkg.version = $version
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json
          Write-Host "Set version to $version"

      - name: Install dependencies
        working-directory: lumina
        run: pnpm install --frozen-lockfile

      - name: Build Desktop (Compile TS)
        working-directory: lumina
        run: pnpm build:desktop

      - name: Package Windows Installer
        working-directory: lumina
        run: pnpm --filter @lumina/desktop package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          path: |
            lumina/apps/desktop/dist/*.exe
            lumina/apps/desktop/release/*.exe
          retention-days: 1

  build-macos:
    needs: prepare
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: lumina/pnpm-lock.yaml

      - name: Set Version in package.json
        working-directory: lumina/apps/desktop
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          # Use node to update package.json (cross-platform safe)
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          echo "Set version to $VERSION"

      - name: Install dependencies
        working-directory: lumina
        run: pnpm install --frozen-lockfile

      - name: Build Desktop (Compile TS)
        working-directory: lumina
        run: pnpm build:desktop

      - name: Package macOS DMG
        working-directory: lumina
        run: pnpm --filter @lumina/desktop package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing for now (unsigned build)
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          if-no-files-found: error
          path: |
            lumina/apps/desktop/release/*.dmg
          retention-days: 1

  upload-release:
    needs: [prepare, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: artifacts/macos

      - name: Prepare Artifacts
        id: prepare
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"

          # Windows: flatten and rename spaces to dashes
          find artifacts/windows -name "*.exe" -type f -exec mv {} artifacts/windows/ \;
          cd artifacts/windows
          WINDOWS_ORIGINAL=$(ls *.exe | head -1)
          WINDOWS_NEW=$(echo "$WINDOWS_ORIGINAL" | sed 's/ /-/g')
          if [ "$WINDOWS_ORIGINAL" != "$WINDOWS_NEW" ]; then
            mv "$WINDOWS_ORIGINAL" "$WINDOWS_NEW"
          fi
          WINDOWS_FILE="$WINDOWS_NEW"
          WINDOWS_SIZE=$(stat -c%s "$WINDOWS_FILE")
          cd ../..

          # macOS: flatten and rename spaces to dashes
          find artifacts/macos -name "*.dmg" -type f -exec mv {} artifacts/macos/ \;
          cd artifacts/macos
          MACOS_ORIGINAL=$(ls *.dmg | head -1)
          MACOS_NEW=$(echo "$MACOS_ORIGINAL" | sed 's/ /-/g')
          if [ "$MACOS_ORIGINAL" != "$MACOS_NEW" ]; then
            mv "$MACOS_ORIGINAL" "$MACOS_NEW"
          fi
          MACOS_FILE="$MACOS_NEW"
          MACOS_SIZE=$(stat -c%s "$MACOS_FILE")
          cd ../..

          echo "windows_file=$WINDOWS_FILE" >> $GITHUB_OUTPUT
          echo "windows_size=$WINDOWS_SIZE" >> $GITHUB_OUTPUT
          echo "macos_file=$MACOS_FILE" >> $GITHUB_OUTPUT
          echo "macos_size=$MACOS_SIZE" >> $GITHUB_OUTPUT

          echo "=== Final artifacts ==="
          ls -la artifacts/windows/
          ls -la artifacts/macos/

      - name: Generate latest.yml for auto-updater
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          # Windows latest.yml
          WINDOWS_FILE="${{ steps.prepare.outputs.windows_file }}"
          WINDOWS_SIZE="${{ steps.prepare.outputs.windows_size }}"
          WINDOWS_SHA512=$(sha512sum "artifacts/windows/$WINDOWS_FILE" | awk '{print $1}' | xxd -r -p | base64 -w 0)

          cat > artifacts/windows/latest.yml << EOF
          version: ${VERSION}
          files:
            - url: ${WINDOWS_FILE}
              sha512: ${WINDOWS_SHA512}
              size: ${WINDOWS_SIZE}
          path: ${WINDOWS_FILE}
          sha512: ${WINDOWS_SHA512}
          releaseDate: $(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          EOF

          echo "Generated Windows latest.yml:"
          cat artifacts/windows/latest.yml

          # macOS latest-mac.yml
          MACOS_FILE="${{ steps.prepare.outputs.macos_file }}"
          MACOS_SIZE="${{ steps.prepare.outputs.macos_size }}"
          MACOS_SHA512=$(sha512sum "artifacts/macos/$MACOS_FILE" | awk '{print $1}' | xxd -r -p | base64 -w 0)

          cat > artifacts/macos/latest-mac.yml << EOF
          version: ${VERSION}
          files:
            - url: ${MACOS_FILE}
              sha512: ${MACOS_SHA512}
              size: ${MACOS_SIZE}
          path: ${MACOS_FILE}
          sha512: ${MACOS_SHA512}
          releaseDate: $(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          EOF

          echo "Generated macOS latest-mac.yml:"
          cat artifacts/macos/latest-mac.yml

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Install AWS CLI (already available on ubuntu-latest, but ensure)
          aws --version

          # Upload Windows installer and latest.yml
          aws s3 cp artifacts/windows/ s3://${R2_BUCKET}/releases/v${VERSION}/ \
            --recursive \
            --endpoint-url ${R2_ENDPOINT}

          # Upload macOS installer and latest-mac.yml
          aws s3 cp artifacts/macos/ s3://${R2_BUCKET}/releases/v${VERSION}/ \
            --recursive \
            --endpoint-url ${R2_ENDPOINT}

          # Also copy latest.yml to root for auto-updater discovery
          aws s3 cp artifacts/windows/latest.yml s3://${R2_BUCKET}/latest.yml \
            --endpoint-url ${R2_ENDPOINT}
          aws s3 cp artifacts/macos/latest-mac.yml s3://${R2_BUCKET}/latest-mac.yml \
            --endpoint-url ${R2_ENDPOINT}

          echo "Uploaded to R2:"
          aws s3 ls s3://${R2_BUCKET}/releases/v${VERSION}/ --endpoint-url ${R2_ENDPOINT}

      - name: Update Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          WINDOWS_FILE="${{ steps.prepare.outputs.windows_file }}"
          WINDOWS_SIZE="${{ steps.prepare.outputs.windows_size }}"
          MACOS_FILE="${{ steps.prepare.outputs.macos_file }}"
          MACOS_SIZE="${{ steps.prepare.outputs.macos_size }}"

          # R2 public URLs
          WINDOWS_URL="${R2_PUBLIC_URL}/releases/v${VERSION}/${WINDOWS_FILE}"
          MACOS_URL="${R2_PUBLIC_URL}/releases/v${VERSION}/${MACOS_FILE}"

          echo "Windows: $WINDOWS_URL ($WINDOWS_SIZE bytes)"
          echo "macOS: $MACOS_URL ($MACOS_SIZE bytes)"

          echo "Updating Supabase..."
          curl --fail-with-body -X POST "${SUPABASE_URL}/rest/v1/releases" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{
              \"version\": \"${VERSION}\",
              \"windows_url\": \"${WINDOWS_URL}\",
              \"windows_size\": ${WINDOWS_SIZE},
              \"macos_url\": \"${MACOS_URL}\",
              \"macos_size\": ${MACOS_SIZE},
              \"release_notes\": \"Release v${VERSION}\"
            }"

          echo "Database updated with R2 download links."
