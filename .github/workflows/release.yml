name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: lumina/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: lumina
        run: pnpm install --frozen-lockfile

      - name: Build Desktop (Compile TS)
        working-directory: lumina
        run: pnpm build:desktop

      - name: Package Windows Installer (Electron Builder)
        working-directory: lumina
        # FIX: Run from root using filter to ensure access to shared node_modules
        run: pnpm --filter @lumina/desktop package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: DEBUG - List Output Directory
        working-directory: lumina/apps/desktop
        run: |
          echo "--- Listing dist folder ---"
          ls dist -ErrorAction SilentlyContinue
          echo "--- Listing release folder ---"
          ls release -ErrorAction SilentlyContinue

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          # FIX: Look in both common output folders (dist and release)
          path: |
            lumina/apps/desktop/dist/*.exe
            lumina/apps/desktop/release/*.exe
          retention-days: 1

  upload-release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows

      - name: Get Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CLEAN_VERSION=$(echo "${{ inputs.version }}" | sed 's/^v//')
            echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Flatten Artifacts
        run: |
          find artifacts/windows -name "*.exe" -type f -exec mv {} artifacts/windows/ \;
          ls -la artifacts/windows/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: artifacts/windows/*.exe
          generate_release_notes: true
