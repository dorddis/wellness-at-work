name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

permissions:
  contents: write

jobs:
  # Determine version once, share across jobs
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Get Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CLEAN_VERSION=$(echo "${{ inputs.version }}" | sed 's/^v//')
          else
            CLEAN_VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $CLEAN_VERSION"

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: lumina/pnpm-lock.yaml

      - name: Set Version in package.json
        working-directory: lumina/apps/desktop
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $pkg = Get-Content package.json | ConvertFrom-Json
          $pkg.version = $version
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json
          Write-Host "Set version to $version"

      - name: Install dependencies
        working-directory: lumina
        run: pnpm install --frozen-lockfile

      - name: Build Desktop (Compile TS)
        working-directory: lumina
        run: pnpm build:desktop

      - name: Package Windows Installer
        working-directory: lumina
        run: pnpm --filter @lumina/desktop package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          path: |
            lumina/apps/desktop/dist/*.exe
            lumina/apps/desktop/release/*.exe
          retention-days: 1

  build-macos:
    needs: prepare
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: lumina/pnpm-lock.yaml

      - name: Set Version in package.json
        working-directory: lumina/apps/desktop
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          # Use node to update package.json (cross-platform safe)
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          echo "Set version to $VERSION"

      - name: Install dependencies
        working-directory: lumina
        run: pnpm install --frozen-lockfile

      - name: Build Desktop (Compile TS)
        working-directory: lumina
        run: pnpm build:desktop

      - name: Package macOS DMG
        working-directory: lumina
        run: pnpm --filter @lumina/desktop package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing for now (unsigned build)
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          if-no-files-found: error
          path: |
            lumina/apps/desktop/release/*.dmg
          retention-days: 1

  upload-release:
    needs: [prepare, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: artifacts/macos

      - name: Rename and Flatten Artifacts
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"

          # Windows: flatten and rename spaces to dashes
          find artifacts/windows -name "*.exe" -type f -exec mv {} artifacts/windows/ \;
          cd artifacts/windows
          WINDOWS_ORIGINAL=$(ls *.exe | head -1)
          WINDOWS_NEW=$(echo "$WINDOWS_ORIGINAL" | sed 's/ /-/g')
          if [ "$WINDOWS_ORIGINAL" != "$WINDOWS_NEW" ]; then
            mv "$WINDOWS_ORIGINAL" "$WINDOWS_NEW"
            echo "Windows: $WINDOWS_ORIGINAL -> $WINDOWS_NEW"
          else
            echo "Windows: $WINDOWS_ORIGINAL (no rename needed)"
          fi
          cd ../..

          # macOS: flatten and rename spaces to dashes
          find artifacts/macos -name "*.dmg" -type f -exec mv {} artifacts/macos/ \;
          cd artifacts/macos
          MACOS_ORIGINAL=$(ls *.dmg | head -1)
          MACOS_NEW=$(echo "$MACOS_ORIGINAL" | sed 's/ /-/g')
          if [ "$MACOS_ORIGINAL" != "$MACOS_NEW" ]; then
            mv "$MACOS_ORIGINAL" "$MACOS_NEW"
            echo "macOS: $MACOS_ORIGINAL -> $MACOS_NEW"
          else
            echo "macOS: $MACOS_ORIGINAL (no rename needed)"
          fi
          cd ../..

          echo "=== Final artifacts ==="
          ls -la artifacts/windows/
          ls -la artifacts/macos/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          files: |
            artifacts/windows/*.exe
            artifacts/macos/*.dmg
          generate_release_notes: true
          body: |
            ## Installation

            **Windows:** Download the `.exe` installer and run it.

            **macOS:** Download the `.dmg` file and drag Lumina to Applications.
            > Note: This is an unsigned build. On first launch, right-click the app and select "Open" to bypass Gatekeeper.

      - name: Update Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # Get Windows file info
          cd artifacts/windows
          WINDOWS_FILE=$(ls *.exe | head -1)
          WINDOWS_SIZE=$(stat -c%s "$WINDOWS_FILE")
          WINDOWS_URL="https://github.com/${REPO}/releases/download/v${VERSION}/${WINDOWS_FILE}"
          cd ../..

          # Get macOS file info
          cd artifacts/macos
          MACOS_FILE=$(ls *.dmg | head -1)
          MACOS_SIZE=$(stat -c%s "$MACOS_FILE")
          MACOS_URL="https://github.com/${REPO}/releases/download/v${VERSION}/${MACOS_FILE}"
          cd ../..

          echo "Windows: $WINDOWS_URL ($WINDOWS_SIZE bytes)"
          echo "macOS: $MACOS_URL ($MACOS_SIZE bytes)"

          echo "Updating Supabase..."
          curl --fail-with-body -X POST "${SUPABASE_URL}/rest/v1/releases" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{
              \"version\": \"${VERSION}\",
              \"windows_url\": \"${WINDOWS_URL}\",
              \"windows_size\": ${WINDOWS_SIZE},
              \"macos_url\": \"${MACOS_URL}\",
              \"macos_size\": ${MACOS_SIZE},
              \"release_notes\": \"Release v${VERSION}\"
            }"

          echo "Database updated with both download links."
