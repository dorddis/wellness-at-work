name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: lumina/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: lumina
        run: pnpm install --frozen-lockfile

      - name: Build Desktop (Compile TS)
        working-directory: lumina
        run: pnpm build:desktop

      - name: Package Windows Installer
        working-directory: lumina
        run: pnpm --filter @lumina/desktop package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          path: |
            lumina/apps/desktop/dist/*.exe
            lumina/apps/desktop/release/*.exe
          retention-days: 1

  upload-release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows

      - name: Get Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CLEAN_VERSION=$(echo "${{ inputs.version }}" | sed 's/^v//')
            echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Rename and Flatten Artifacts
        # FIX: Rename file to replace spaces with dashes (Lumina-Setup.exe) to avoid URL mismatch
        run: |
          find artifacts/windows -name "*.exe" -type f -exec mv {} artifacts/windows/ \;
          
          cd artifacts/windows
          ORIGINAL_FILE=$(ls *.exe | head -1)
          # Replace spaces with dashes
          NEW_FILENAME=$(echo "$ORIGINAL_FILE" | sed 's/ /-/g')
          mv "$ORIGINAL_FILE" "$NEW_FILENAME"
          
          echo "Renamed $ORIGINAL_FILE to $NEW_FILENAME"
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: artifacts/windows/*.exe
          generate_release_notes: true

      - name: Update Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          cd artifacts/windows
          WINDOWS_FILE=$(ls *.exe | head -1)
          
          if [ -z "$WINDOWS_FILE" ]; then
            echo "Error: No .exe file found!"
            exit 1
          fi

          WINDOWS_SIZE=$(stat -c%s "$WINDOWS_FILE")
          # Filename now strictly has dashes, safe for URLs
          WINDOWS_FILENAME=$(basename "$WINDOWS_FILE")

          # Construct the clean GitHub URL
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/v${VERSION}/${WINDOWS_FILENAME}"
          
          echo "Generated URL: $DOWNLOAD_URL"

          echo "Updating Supabase..."
          curl --fail-with-body -X POST "${SUPABASE_URL}/rest/v1/releases" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{
              \"version\": \"${VERSION}\",
              \"windows_url\": \"${DOWNLOAD_URL}\",
              \"windows_size\": ${WINDOWS_SIZE},
              \"macos_url\": null,
              \"macos_size\": 0,
              \"release_notes\": \"Release v${VERSION}\"
            }"
            
          echo "? Database updated with public link."
